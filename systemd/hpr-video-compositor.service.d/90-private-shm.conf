[Service]
# Capture and all its consumer children share this mount. Login/user IPC cleanup
# in the host namespace cannot unlink live camera buffers used for reconnects.
TemporaryFileSystem=/dev/shm:rw,nosuid,nodev,mode=1777,size=128M
Environment=XDG_CACHE_HOME=/run/hpr-video/cache
Environment=GSETTINGS_BACKEND=memory
