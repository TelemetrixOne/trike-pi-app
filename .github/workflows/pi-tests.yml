name: Pi source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.test.txt
      - run: python -m unittest discover -s tests -q
      # Exercise real local flock/nested Bash admission with mocked HTTP only.
      - run: sudo "$(command -v python)" -m unittest tests.test_maintenance -q
      - run: python -m compileall -q hpr_gateway bin scripts
      - run: find scripts bin -name '*.sh' -print0 | xargs -0 -n1 bash -n
